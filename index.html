<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月易診所｜公告產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: #D3D3D3;
  min-height: 100vh;
  padding: 32px 24px;
  color: #333;
}
.notice {
  max-width: 1100px;
  margin: 0 auto 20px;
  background: #FFF3CD;
  border: 1px solid #FFE69C;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #664d03;
  line-height: 1.6;
}
.app {
  max-width: 1100px;
  margin: 0 auto;
}
h1 {
  font-size: 14px;
  font-weight: 400;
  text-align: center;
  margin-bottom: 24px;
  color: #8a8a8a;
  letter-spacing: 0.04em;
}

/* ── Tab bar：比照依貝版，整個外框一個邊界，中間分隔線 ── */
.tab-bar {
  display:flex;
  border: 2px solid #222;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 20px;
  max-width: 320px;
}
.tab-btn {
  flex:1;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 10px 0;
  border: none;
  background: transparent;
  color: #222;
  cursor: pointer;
}
.tab-btn:not(:last-child) { border-right: 2px solid #222; }
.tab-btn.active { background:#222; color:#fff; }
.tab-btn:not(.active):hover { background: rgba(0,0,0,0.05); }

/* ── 左右分欄（依貝風格）：左表單固定寬、右畫布吃剩餘寬度 ── */
.panel { display: none; }
.panel.active { display: flex; flex-direction: column; gap: 20px; }
.panel-row { display: flex; gap: 32px; align-items:flex-start; }
.form-col {
  flex: 0 0 320px;
  max-width: 320px;
  display:flex; flex-direction:column; gap:14px;
}
.preview-col {
  flex: 1;
  display:flex; gap: 20px; align-items:flex-start; flex-wrap: wrap;
}

.form-group { display:flex; flex-direction:column; gap:6px; }
.form-label { font-size: 12px; color: #888; letter-spacing: 0.03em; }
input[type=text], input[type=date], textarea {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  padding: 8px 10px;
  border: 1.5px solid #ddd;
  border-radius: 6px;
  outline: none;
}
input[type=text], textarea { width: 100%; }
input:focus, textarea:focus { border-color: #999; }
textarea { min-height: 80px; resize: vertical; line-height: 1.6; }

.entry-list-title { font-size:12px; color:#888; letter-spacing:0.03em; margin-bottom:2px; }
.entry-list { display:flex; flex-direction:column; gap:6px; }
.entry-empty { font-size:13px; color:#bbb; padding:10px 0; text-align:center; }
.entry-row {
  display:flex; align-items:center; gap:10px;
  background:#fafafa; border:1px solid #eee; border-radius:8px; padding:8px 10px;
}
.entry-tag {
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
  flex-shrink:0;
}
.entry-tag.single { background:#E8ECEF; color:#4A5A66; }
.entry-tag.range { background:#EFE7DA; color:#7A5C2E; }
.entry-text { flex:1; font-size:14px; color:#333; font-weight:700; }
.entry-del {
  border:none; background:none; color:#c0392b; font-size:18px; cursor:pointer;
  width:24px; height:24px; flex-shrink:0; line-height:1;
}
.entry-del:hover { color:#e74c3c; }

.add-box {
  border:1.5px solid #e5e5e5; border-radius:10px; padding:12px; margin-top:4px;
  background:#fcfcfc; display:flex; flex-direction:column; gap:10px;
}
.mode-switch { display:flex; gap:6px; }
.mode-btn {
  flex:1;
  font-family:'Noto Sans TC', sans-serif;
  font-size:13px; font-weight:700; padding:7px 0;
  border:1.5px solid #ddd; border-radius:20px; background:#fff; color:#888; cursor:pointer;
}
.mode-btn.active { background:#222; color:#fff; border-color:#222; }

.add-date-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.add-date-row .form-label { min-width:32px; }
.add-line-btn {
  font-family:'Noto Sans TC', sans-serif;
  font-weight:700;
  font-size:13px; padding:9px 0; border:none; border-radius:8px;
  background:#222; color:#fff; cursor:pointer;
}
.add-line-btn:hover { background:#444; }

.range-wrap { display:flex; flex-direction:column; gap:10px; }

.preview-block { display:flex; flex-direction:column; gap:16px; }
.dl-btn {
  margin-top: 6px;
  width: 100%;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight:700;
  font-size: 14px;
  padding: 12px 0;
  background: #222;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.dl-btn:hover { background: #444; }
.stage-block { display:flex; flex-direction:column; align-items:center; gap:6px; }
.stage-tag { font-size:11px; color:#999; }
.stage-wrap {
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.15);
  width: min(340px, 40vw);
}
.stage-wrap.sq { aspect-ratio: 1 / 1; }
.stage-wrap.r45 { aspect-ratio: 1080 / 1350; }
@media (max-width: 480px) {
  .stage-wrap { width: min(300px, 88vw); }
}
.stage {
  position: relative;
  transform-origin: top left;
  background-color: #FFFFFF;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.stage.ready { opacity: 1; }
.box-overlay {
  position:absolute;
  background: rgba(255,255,255,0.58);
}
.txt-title {
  position:absolute;
  width: 1080px;
  left: 0;
  text-align: center;
  font-weight: 700;
  font-size: 58px;
  color: #2B2B2B;
  letter-spacing: 0.1em;
}
.txt-body {
  position:absolute;
  width: 595px;
  text-align: center;
  font-weight: 700;
  font-size: 46px;
  line-height: 1.5;
  color: #2B2B2B;
}
.txt-footer {
  position:absolute;
  width: 1080px;
  left:0;
  text-align: center;
  font-weight: 400;
  font-size: 26px;
  color: #6B6B6B;
  letter-spacing: 0.1em;
}

/* ── RWD：窄螢幕改上下排列 ── */
@media (max-width: 900px) {
  .panel-row { flex-direction: column; gap: 24px; }
  .form-col { flex: 1 1 auto; max-width: none; width: 100%; }
  .preview-col { width: 100%; justify-content: center; }
  .tab-bar { max-width: 100%; }
}
@media (max-width: 480px) {
  body { padding: 12px; }
  .app { padding: 16px; }
}
</style>
<script>
function scaleStages(){
  document.querySelectorAll('.stage-wrap').forEach(function(wrap){
    var stage = wrap.querySelector('.stage');
    if(!stage) return;
    var realW = parseInt(stage.style.width, 10) || 1080;
    var rect = wrap.getBoundingClientRect();
    if(rect.width <= 0) return;
    var scale = rect.width / realW;
    stage.style.transform = 'scale(' + scale + ')';
    stage.classList.add('ready');
  });
}
window.addEventListener('resize', scaleStages);
window.addEventListener('orientationchange', scaleStages);
</script>
</head>
<body>


<div class="app">
<h1>月易診所 BOWEL EASY CLINIC｜公告產生器</h1>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('duori')">多日休診</button>
  <button class="tab-btn" onclick="switchTab('custom')">純文字自訂</button>
</div>

<!-- ===== TAB: 多日休診 ===== -->
<div class="panel active" id="panel-duori">
  <div class="panel-row">
  <div class="form-col">
    <div class="form-group">
      <span class="form-label">標題</span>
      <input type="text" id="duori-title" value="休診公告" oninput="renderAll()">
    </div>

    <div class="form-group">
      <span class="form-label">休診日期（可混合加入「單日」與「連續區間」）</span>

      <div class="entry-list-title">已加入的日期</div>
      <div class="entry-list" id="entry-chip-row"></div>

      <div class="add-box">
        <div class="mode-switch">
          <button class="mode-btn active" id="add-type-single" onclick="setAddType('single')">單日</button>
          <button class="mode-btn" id="add-type-range" onclick="setAddType('range')">連續區間</button>
        </div>
        <div class="add-date-row" id="add-single-ui">
          <input type="date" id="add-single-input" style="flex:1;">
          <button class="add-line-btn" style="flex-shrink:0; padding:9px 16px;" onclick="addSingleEntry()">加入</button>
        </div>
        <div class="range-wrap" id="add-range-ui" style="display:none;">
          <div class="add-date-row">
            <span class="form-label">起始</span>
            <input type="date" id="add-range-start" style="flex:1;">
            <span class="form-label">結束</span>
            <input type="date" id="add-range-end" style="flex:1;">
          </div>
          <button class="add-line-btn" onclick="addRangeEntry()">加入這段區間</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <span class="form-label">狀態文字（框內最後一行）</span>
      <input type="text" id="duori-status" value="休診" oninput="renderAll()">
    </div>

    <div class="form-group">
      <span class="form-label">底部備註</span>
      <input type="text" id="duori-footer" value="造成不便 敬請見諒" oninput="renderAll()">
    </div>
  </div>

  <div class="preview-block">
  <div class="preview-col">
    <div class="stage-block">
      <span class="stage-tag">方形 1080×1080</span>
      <div class="stage-wrap sq">
        <div class="stage" id="stage-duori-sq" style="width:1080px;height:1080px;">
        </div>
      </div>
    </div>
    <div class="stage-block">
      <span class="stage-tag">4:5 直式 1080×1350</span>
      <div class="stage-wrap r45">
        <div class="stage" id="stage-duori-45" style="width:1080px;height:1350px;">
        </div>
      </div>
    </div>
  </div>
  <button class="dl-btn" onclick="downloadBoth('duori')">↓ 下載兩張圖（方形＋4:5）</button>
  </div>
  </div>
</div>

<!-- ===== TAB: 純文字自訂 ===== -->
<div class="panel" id="panel-custom">
  <div class="panel-row">
  <div class="form-col">
    <div class="form-group">
      <span class="form-label">標題</span>
      <input type="text" id="custom-title" value="公告標題" oninput="renderAll()">
    </div>
    <div class="form-group">
      <span class="form-label">內文（自由換行）</span>
      <textarea id="custom-body" oninput="renderAll()">請自行輸入內容</textarea>
    </div>
    <div class="form-group">
      <span class="form-label">底部備註</span>
      <input type="text" id="custom-footer" value="" oninput="renderAll()">
    </div>
  </div>

  <div class="preview-block">
  <div class="preview-col">
    <div class="stage-block">
      <span class="stage-tag">方形 1080×1080</span>
      <div class="stage-wrap sq">
        <div class="stage" id="stage-custom-sq" style="width:1080px;height:1080px;">
        </div>
      </div>
    </div>
    <div class="stage-block">
      <span class="stage-tag">4:5 直式 1080×1350</span>
      <div class="stage-wrap r45">
        <div class="stage" id="stage-custom-45" style="width:1080px;height:1350px;">
        </div>
      </div>
    </div>
  </div>
  <button class="dl-btn" onclick="downloadBoth('custom')">↓ 下載兩張圖（方形＋4:5）</button>
  </div>
  </div>
</div>

</div>

const BOX_W = 675, BOX_MIN_H = 338;
const BOX_W_MAX = 940;   // 方框最大寬度：內容太長時放寬方框，而不是硬拆行
const BOX_PAD_V = 138;   // 上下總留白（約各1.5個字高 = 1.5*46*2）
const BOX_PAD_H = 80;    // 左右總留白（文字最大寬度 = boxW - BOX_PAD_H）
const TITLE_SIZE = 58, BODY_SIZE = 46, FOOTER_SIZE = 26;
const LETTER_SPACING_RATIO = 0.10; // +10% 字距

function boxLeft(canvasW, boxW){ return (canvasW - boxW) / 2; }

/* ---------- 日期格式化 ---------- */
const WD = ['日','一','二','三','四','五','六'];
function weekdayChar(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return WD[d.getDay()];
}
function fmtDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return (d.getMonth()+1) + '/' + d.getDate() + '（' + weekdayChar(dateStr) + '）';
}
function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

/* ---------- 多日休診：日期清單（單日／區間 混合） ---------- */
// entry: {type:'single', date} 或 {type:'range', start, end}
let dateEntries = [];
let addType = 'single';

function setAddType(t){
  addType = t;
  document.getElementById('add-type-single').classList.toggle('active', t==='single');
  document.getElementById('add-type-range').classList.toggle('active', t==='range');
  document.getElementById('add-single-ui').style.display = (t==='single') ? 'flex' : 'none';
  document.getElementById('add-range-ui').style.display = (t==='range') ? 'flex' : 'none';
}

function addSingleEntry(){
  const val = document.getElementById('add-single-input').value;
  if(val) dateEntries.push({ type:'single', date: val });
  renderEntryChips();
  renderAll();
}
function addRangeEntry(){
  const s = document.getElementById('add-range-start').value;
  const e = document.getElementById('add-range-end').value;
  if(s && e) dateEntries.push({ type:'range', start: s, end: e });
  renderEntryChips();
  renderAll();
}
function removeEntry(idx){
  dateEntries.splice(idx,1);
  renderEntryChips();
  renderAll();
}
function fmtEntry(e){
  if(e.type === 'single') return fmtDate(e.date);
  return fmtDate(e.start) + '～' + fmtDate(e.end);
}
function renderEntryChips(){
  const row = document.getElementById('entry-chip-row');
  row.innerHTML = '';
  if(dateEntries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'entry-empty';
    empty.textContent = '目前還沒有加入任何日期';
    row.appendChild(empty);
    return;
  }
  dateEntries.forEach((e, i) => {
    const item = document.createElement('div');
    item.className = 'entry-row';

    const tag = document.createElement('span');
    tag.className = 'entry-tag ' + e.type;
    tag.textContent = (e.type === 'single') ? '單日' : '區間';

    const text = document.createElement('span');
    text.className = 'entry-text';
    text.textContent = fmtEntry(e);

    const rm = document.createElement('button');
    rm.className = 'entry-del';
    rm.textContent = '🗑';
    rm.title = '刪除';
    rm.onclick = () => removeEntry(i);

    item.appendChild(tag);
    item.appendChild(text);
    item.appendChild(rm);
    row.appendChild(item);
  });
}

function buildDuoriBodyRaw(){
  const dateText = dateEntries.map(fmtEntry).join('、');
  const status = document.getElementById('duori-status').value;
  return status ? (dateText + '\n' + status) : dateText;
}

/* ---------- 文字量測／字距／換行（供預覽與下載共用） ---------- */
const measureCtx = document.createElement('canvas').getContext('2d');

// 「～」前後不額外加字距：全形波浪符號字型本身左右就有留白，
// 再加字距視覺上會變成一個明顯的空白
function gapAfter(ch, nextCh, spacing){
  if(nextCh === undefined) return 0;
  if(ch === '～' || nextCh === '～') return 0;
  return spacing;
}
function spacedWidth(ctx, text, spacing){
  const chars = Array.from(text);
  let w = 0;
  for(const ch of chars){ w += ctx.measureText(ch).width; }
  for(let i = 0; i < chars.length - 1; i++){ w += gapAfter(chars[i], chars[i+1], spacing); }
  return w;
}
// 畫面預覽用逐字 span 模擬字距，跟下載 PNG（canvas 逐字繪製）用同一套間距規則，
// 避免瀏覽器 CSS letter-spacing 跟 canvas 量測結果對不上
function escapeHTML(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderSpacedLineHTML(text, spacing){
  const chars = Array.from(text);
  return chars.map((ch, i) => {
    const gap = gapAfter(ch, chars[i+1], spacing);
    return '<span style="margin-right:' + gap + 'px">' + escapeHTML(ch) + '</span>';
  }).join('');
}
const NO_LINE_START = '）」』】》〉’”,.、。，：；！？!?)]}>';
const NO_LINE_END = '（「『【《〈‘“([{<';
// 「日期（禮拜幾）」視為不可拆的單位，換行時不會拆散日期跟括號裡的禮拜幾
const TOKEN_RE = /\d{1,2}\/\d{1,2}（[日一二三四五六]）|[\s\S]/g;
// 把不能當行首／行尾的符號直接黏到該依附的詞元上，換行只會發生在黏合後的詞元之間
function tokenizeForWrap(text){
  const raw = text.match(TOKEN_RE) || [text];
  const merged = [];
  for(const tok of raw){
    if(merged.length && NO_LINE_START.includes(tok[0])){
      merged[merged.length - 1] += tok;
    } else {
      merged.push(tok);
    }
  }
  const out = [];
  for(const tok of merged){
    if(out.length && NO_LINE_END.includes(out[out.length - 1][out[out.length - 1].length - 1])){
      out[out.length - 1] += tok;
    } else {
      out.push(tok);
    }
  }
  return out;
}
function wrapByChar(ctx, text, maxWidth, spacing){
  const tokens = tokenizeForWrap(text);
  const out = [];
  let line = '';
  for(const tok of tokens){
    const test = line + tok;
    const overWidth = line && spacedWidth(ctx, test, spacing) > maxWidth;
    if(overWidth){ out.push(line); line = tok; }
    else line = test;
  }
  if(line) out.push(line);
  return out.length ? out : [''];
}
/* 以「、」分隔的每一段（例如單日、連續區間）視為不可拆的單位，優先在段落交界處換行；
   單一段落本身就超寬時才退回逐字換行 */
function wrapParagraph(ctx, text, maxWidth, spacing){
  const rawChunks = text.split('、');
  if(rawChunks.length <= 1) return wrapByChar(ctx, text, maxWidth, spacing);
  const chunks = rawChunks.map((c, i) => i < rawChunks.length - 1 ? c + '、' : c).filter(c => c !== '');

  const out = [];
  let line = '';
  for(const chunk of chunks){
    const test = line + chunk;
    if(line && spacedWidth(ctx, test, spacing) > maxWidth){
      out.push(line);
      line = chunk;
    } else {
      line = test;
    }
    if(spacedWidth(ctx, line, spacing) > maxWidth){
      const subLines = wrapByChar(ctx, line, maxWidth, spacing);
      out.push(...subLines.slice(0, -1));
      line = subLines[subLines.length - 1];
    }
  }
  if(line) out.push(line);
  return out.length ? out : [''];
}
function wrapRawText(ctx, raw, maxWidth, spacing){
  const out = [];
  raw.split('\n').forEach(p => {
    if(p === ''){ out.push(''); return; }
    out.push(...wrapParagraph(ctx, p, maxWidth, spacing));
  });
  return out;
}

// 每一段以「、」分隔出的內容（例如一整段日期區間）視為不可拆單位，
// 量出其中最寬的一段，方框寬度會放寬去容納它，超過最大寬度才退回逐字換行
function measureMaxChunkWidth(ctx, rawText, spacing){
  let max = 0;
  rawText.split('\n').forEach(p => {
    if(p === '') return;
    const rawChunks = p.split('、');
    const chunks = rawChunks.length <= 1
      ? [p]
      : rawChunks.map((c, i) => i < rawChunks.length - 1 ? c + '、' : c).filter(c => c !== '');
    chunks.forEach(c => { const w = spacedWidth(ctx, c, spacing); if(w > max) max = w; });
  });
  return max;
}
function computeBodyLayout(rawText, widenBox){
  measureCtx.font = "700 " + BODY_SIZE + "px 'Noto Sans TC', sans-serif";
  const spacing = BODY_SIZE * LETTER_SPACING_RATIO;
  let boxW = BOX_W;
  if(widenBox){
    const needed = measureMaxChunkWidth(measureCtx, rawText, spacing) + BOX_PAD_H;
    boxW = Math.min(BOX_W_MAX, Math.max(BOX_W, needed));
  }
  const maxWidth = boxW - BOX_PAD_H;
  const lines = wrapRawText(measureCtx, rawText, maxWidth, spacing);
  const lineHeight = BODY_SIZE * 1.5;
  const contentH = lines.length * lineHeight;
  const boxH = Math.max(BOX_MIN_H, contentH + BOX_PAD_V);
  return { lines, lineHeight, boxH, boxW };
}

/* ---------- 畫面預覽 ---------- */
function buildStage(el, canvasW, canvasH, bgUrl, data){
  el.style.backgroundImage = "url(" + bgUrl + ")";
  el.innerHTML = "";

  const layout = computeBodyLayout(data.body, data.widen);
  const boxW = layout.boxW;
  const boxH = layout.boxH;
  const bTop = (canvasH - boxH) / 2;
  const bLeft = boxLeft(canvasW, boxW);

  const box = document.createElement("div");
  box.className = "box-overlay";
  box.style.left = bLeft + "px";
  box.style.top = bTop + "px";
  box.style.width = boxW + "px";
  box.style.height = boxH + "px";
  el.appendChild(box);

  const title = document.createElement("div");
  title.className = "txt-title";
  title.style.top = (bTop - 56 - TITLE_SIZE) + "px";
  title.textContent = data.title;
  el.appendChild(title);

  const body = document.createElement("div");
  body.className = "txt-body";
  body.style.left = (canvasW/2 - (boxW - BOX_PAD_H)/2) + "px";
  body.style.width = (boxW - BOX_PAD_H) + "px";
  body.style.top = bTop + "px";
  body.style.height = boxH + "px";
  body.style.display = "flex";
  body.style.flexDirection = "column";
  body.style.alignItems = "center";
  body.style.justifyContent = "center";
  const bodySpacing = BODY_SIZE * LETTER_SPACING_RATIO;
  body.innerHTML = layout.lines.map(ln => '<div>' + renderSpacedLineHTML(ln, bodySpacing) + '</div>').join('');
  el.appendChild(body);

  const footer = document.createElement("div");
  footer.className = "txt-footer";
  footer.style.top = (bTop + boxH + 40) + "px";
  footer.textContent = data.footer;
  el.appendChild(footer);
}

function getData(tab){
  if(tab === 'duori'){
    return {
      title: document.getElementById('duori-title').value,
      body: buildDuoriBodyRaw(),
      footer: document.getElementById('duori-footer').value,
      widen: true
    };
  }
  return {
    title: document.getElementById(tab+"-title").value,
    body: document.getElementById(tab+"-body").value,
    footer: document.getElementById(tab+"-footer").value,
    widen: false
  };
}

function render(tab){
  const data = getData(tab);
  buildStage(document.getElementById("stage-"+tab+"-sq"), 1080, 1080, BG_SQ, data);
  buildStage(document.getElementById("stage-"+tab+"-45"), 1080, 1350, BG_45, data);
}
function renderAll(){
  render('duori');
  render('custom');
}

/* ---------- 下載（Canvas 2D，手動加字距） ---------- */
function fillTextSpacedCentered(ctx, text, cx, y, spacing){
  const totalW = spacedWidth(ctx, text, spacing);
  let x = cx - totalW/2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  const chars = Array.from(text);
  chars.forEach((ch, i) => {
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width + gapAfter(ch, chars[i+1], spacing);
  });
  ctx.textAlign = prevAlign;
}

/* ---------- PNG DPI 注入（嵌入 pHYs chunk，讓輸出圖片是 150 DPI） ---------- */
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c;
  }
  return t;
})();
function _crc32(buf, start, len) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < start + len; i++) c = _crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function injectDPI(pngBlob, dpi) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const orig = new Uint8Array(e.target.result);
      const ppm  = Math.round(dpi / 0.0254); // pixels per metre
      const phys = new Uint8Array(21);        // 4+4+9+4
      const dv   = new DataView(phys.buffer);
      dv.setUint32(0, 9);                     // data length
      phys.set([0x70,0x48,0x59,0x73], 4);    // "pHYs"
      dv.setUint32(8,  ppm);
      dv.setUint32(12, ppm);
      phys[16] = 1;                           // unit = metre
      dv.setUint32(17, _crc32(phys, 4, 13));
      const out = new Uint8Array(orig.length + 21);
      out.set(orig.slice(0, 33));             // sig(8) + IHDR chunk(25)
      out.set(phys, 33);
      out.set(orig.slice(33), 54);
      resolve(new Blob([out], { type: 'image/png' }));
    };
    reader.readAsArrayBuffer(pngBlob);
  });
}

async function drawCanvasPNG(canvasW, canvasH, bgUrl, data){
  const canvas = document.createElement("canvas");
  canvas.width = canvasW; canvas.height = canvasH;
  const ctx = canvas.getContext("2d");

  const img = new Image();
  img.src = bgUrl;
  await new Promise(res => { img.onload = res; });
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvasW, canvasH);
  ctx.drawImage(img, 0, 0, canvasW, canvasH);

  await document.fonts.ready;

  const layout = computeBodyLayout(data.body, data.widen);
  const boxW = layout.boxW;
  const boxH = layout.boxH;
  const bTop = (canvasH - boxH) / 2;
  const bLeft = boxLeft(canvasW, boxW);

  ctx.fillStyle = "rgba(255,255,255,0.58)";
  ctx.fillRect(bLeft, bTop, boxW, boxH);

  ctx.fillStyle = "#2B2B2B";
  ctx.font = "700 " + TITLE_SIZE + "px 'Noto Sans TC', sans-serif";
  ctx.textBaseline = "alphabetic";
  fillTextSpacedCentered(ctx, data.title, canvasW/2, bTop - 56, TITLE_SIZE * LETTER_SPACING_RATIO);

  ctx.font = "700 " + BODY_SIZE + "px 'Noto Sans TC', sans-serif";
  const lh = layout.lineHeight;
  const totalH = layout.lines.length * lh;
  let startY = bTop + boxH/2 - totalH/2 + lh*0.78;
  layout.lines.forEach((ln, i) => {
    fillTextSpacedCentered(ctx, ln, canvasW/2, startY + i*lh, BODY_SIZE * LETTER_SPACING_RATIO);
  });

  ctx.fillStyle = "#6B6B6B";
  ctx.font = "400 " + FOOTER_SIZE + "px 'Noto Sans TC', sans-serif";
  fillTextSpacedCentered(ctx, data.footer, canvasW/2, bTop + boxH + 40 + FOOTER_SIZE, FOOTER_SIZE * LETTER_SPACING_RATIO);

  return new Promise(res => canvas.toBlob(b => res(b), "image/png"));
}

async function downloadBoth(tab){
  const data = getData(tab);
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10).replace(/-/g,"");
  const titleSafe = data.title.replace(/[\\/:*?"<>|]/g, "");

  const blobSq = await drawCanvasPNG(1080, 1080, BG_SQ, data);
  const dpiSq = await injectDPI(blobSq, 150);
  const aSq = document.createElement("a");
  aSq.download = `月易-${dateStr}-${titleSafe}-方形.png`;
  aSq.href = URL.createObjectURL(dpiSq);
  aSq.click();

  setTimeout(async () => {
    const blob45 = await drawCanvasPNG(1080, 1350, BG_45, data);
    const dpi45 = await injectDPI(blob45, 150);
    const a45 = document.createElement("a");
    a45.download = `月易-${dateStr}-${titleSafe}-4x5.png`;
    a45.href = URL.createObjectURL(dpi45);
    a45.click();
  }, 400);
}
